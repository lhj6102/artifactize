<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Viewer</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    header { display: flex; gap: .75rem; align-items: center; padding: .65rem .85rem; border-bottom: 1px solid GrayText; }
    #status { min-width: 0; overflow-wrap: anywhere; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: white; }
  </style>
</head>
<body>
  <header>
    <button id="point" type="button" hidden>Point</button>
    <span id="status" role="status">Opening Artifact…</span>
  </header>
  <iframe id="page" title="Artifact page" sandbox="allow-scripts"></iframe>
  <script>
    const channel = 'artifactize-viewer/v1';
    const pending = new Map();
    let sequence = 0;
    const page = document.querySelector('#page');
    const point = document.querySelector('#point');
    const status = document.querySelector('#status');
    let armed = false;

    function bridge(method, args = {}) {
      return new Promise((resolve, reject) => {
        const id = ++sequence;
        pending.set(id, { resolve, reject });
        // The host identifies this sandbox by its WindowProxy, not by its opaque origin.
        parent.postMessage({ channel, id, method, args }, '*');
      });
    }

    function arm(next) {
      armed = next;
      point.setAttribute('aria-pressed', String(armed));
      status.textContent = armed ? 'Click an element to point.' : '';
      page.contentWindow.postMessage({ type: 'point', armed }, '*');
    }

    window.addEventListener('keydown', (event) => {
      if (armed && event.key === 'Escape') arm(false);
    });

    window.addEventListener('message', async (event) => {
      if (event.source === parent && event.data?.channel === channel) {
        if (event.data.event === 'activeReviewChanged') {
          if (armed) arm(false);
          checkingReview().catch(() => {});
          return;
        }
        const { id, result, error } = event.data;
        const call = pending.get(id);
        if (!call) return;
        pending.delete(id);
        if (typeof error === 'string') call.reject(new Error(error));
        else call.resolve(result);
      } else if (event.source === page.contentWindow && armed && event.data?.cancelPoint === true) {
        arm(false);
      } else if (event.source === page.contentWindow && armed && typeof event.data?.selector === 'string') {
        armed = false;
        point.removeAttribute('aria-pressed');
        try {
          await bridge('pointing', { text: event.data.selector });
          status.textContent = `Pointed at ${event.data.selector}`;
        } catch (error) {
          status.textContent = error.message;
        }
        checkingReview().catch(() => {});
      }
    });

    // Run Point in the inner sandbox. The Artifact's scripts can still operate that page,
    // but its origin is different even from the plugin, and it never receives the host bridge.
    function inPage() {
      let armed = false;
      window.addEventListener('message', (event) => {
        if (event.source === parent && event.data?.type === 'point') {
          armed = event.data.armed === true;
          document.documentElement.style.cursor = armed ? 'crosshair' : '';
        }
      });
      function selector(element) {
        const suffix = [];
        let unique;
        for (let current = element; current; current = current.parentElement) {
          const id = current.id && `#${CSS.escape(current.id)}`;
          if (id && document.querySelectorAll(id).length === 1) {
            const name = suffix.length === 1 ? `${id} ${suffix[0]}` : [id, ...suffix].join(' > ');
            if (document.querySelectorAll(name).length === 1) return name;
            return [id, ...suffix].join(' > ');
          }
          const className = current.classList[0];
          const candidate = className ? `.${CSS.escape(className)}` : CSS.escape(current.localName);
          if (!unique && document.querySelectorAll(candidate).length === 1) unique = [candidate, ...suffix].join(' > ');
          const siblings = Array.from(current.parentElement?.children ?? []);
          const position = siblings.indexOf(current) + 1;
          const withinParent = siblings.filter((child) => child.matches(candidate)).length === 1;
          suffix.unshift(withinParent || position === 0 ? candidate : `${candidate}:nth-child(${position})`);
        }
        return unique ?? suffix.join(' > ');
      }
      document.addEventListener('keydown', (event) => {
        if (armed && event.key === 'Escape') {
          armed = false;
          document.documentElement.style.cursor = '';
          parent.postMessage({ cancelPoint: true }, '*');
        }
      }, true);
      document.addEventListener('click', (event) => {
        if (!armed || !(event.target instanceof Element)) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        armed = false;
        document.documentElement.style.cursor = '';
        parent.postMessage({ selector: selector(event.target) }, '*');
      }, true);
    }

    async function checkingReview() {
      try {
        const context = await bridge('context');
        point.hidden = context.review == null;
        return context;
      } catch (error) {
        point.hidden = true;
        throw error;
      }
    }
    point.addEventListener('click', async () => {
      try {
        if (!(await checkingReview()).review) return;
        arm(!armed);
      } catch (error) {
        status.textContent = error.message;
      }
    });
    window.addEventListener('focus', () => { checkingReview().catch(() => {}); });

    async function open() {
      const context = await checkingReview();
      const html = await bridge('readText', { path: context.targetKind === 'file' ? '' : 'index.html' });
      const policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'";
      const source = html.replace(/^\s*<!doctype[^>]*>/i, '');
      page.srcdoc = `<!doctype html><meta http-equiv="Content-Security-Policy" content="${policy}">`
        + `<script>(${inPage})()<\/script>${source}`;
      status.textContent = '';
    }
    open().catch((error) => { status.textContent = error.message; });
  </script>
</body>
</html>
