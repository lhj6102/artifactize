name: macOS flake regression
on:
  workflow_dispatch:
jobs:
  repeat:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Repeat affected test binaries 30 times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifactize-flakes"
          export TMPDIR="$RUNNER_TEMP/artifactize-flakes"
          for iteration in {1..30}; do
            echo "Iteration $iteration/30"
            cargo test --locked -p artifactize --lib changes::tests::multiprocess
            cargo test --locked -p artifactize --test runtime deadline
            cargo test --locked -p artifactize --lib platform::unix::process::tests::killing_a_zombie
          done
