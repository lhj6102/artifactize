name: CI

# Changes that touch only the website (built by website.yml) skip the Rust checks.
# Only the Linux check gates pull requests. Windows and macOS run on main pushes and
# weekly schedules as failure-reporting checks, so regressions turn main red and notify
# subscribers; they never run on pull requests. Manual runs remain informational.
on:
  push:
    branches: [main]
    paths-ignore: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths-ignore: ["website/**", ".github/workflows/website.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Packages the crate and builds the package as crates.io would, without uploading.
      - run: cargo publish --dry-run --locked -p artifactize-tools -p artifactize
  # The desktop app (crates/artifactize-desktop) is outside default-members: it needs
  # WebKitGTK and its built frontend, so it builds and tests here, on Linux only.
  desktop:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK, its WebDriver and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/artifactize-desktop/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/artifactize-desktop/ui/pnpm-lock.yaml
      - working-directory: crates/artifactize-desktop/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build
      # The bindings test fails when ui/src/ipc/bindings.ts no longer matches the commands.
      - run: cargo clippy --locked -p artifactize-desktop --all-targets -- -D warnings
      - run: cargo test --locked -p artifactize-desktop
      - run: cargo install --locked tauri-driver --version 2.1.0
      - run: cargo build --locked -p artifactize -p artifactize-desktop
      # The e2e driver runs the app on its own Xvfb display.
      - working-directory: crates/artifactize-desktop/ui
        run: pnpm e2e
  windows:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Tests build their Windows stand-ins for /bin/sh with this rustc, and run python3.
      - run: cargo test --locked --no-fail-fast
  macos:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast
