name: CI

# Changes that touch only the website (built by website.yml) skip the Rust checks.
# Before v1, only the Linux check gates changes; pushes to main keep its cache warm for
# release.yml. Windows runs weekly and by hand, as an informational signal that never
# fails the workflow.
on:
  push:
    branches: [main]
    paths-ignore: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths-ignore: ["website/**", ".github/workflows/website.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Packages the crate and builds the package as crates.io would, without uploading.
      - run: cargo publish --dry-run --locked -p artifactize-tools -p artifactize
  windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Tests build their Windows stand-ins for /bin/sh with this rustc, and run python3.
      - run: cargo test --locked
