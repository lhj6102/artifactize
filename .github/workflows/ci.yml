name: CI

# Changes that touch only the website (built by website.yml) skip the Rust checks.
on:
  push:
    paths-ignore: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths-ignore: ["website/**", ".github/workflows/website.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Packages the crate and builds the package as crates.io would, without uploading.
      - run: cargo publish --dry-run --locked -p artifactize
