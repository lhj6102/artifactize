# Build every OS on main and release/* PRs and pushes; Windows/macOS also enforce
# native platform contracts. Desktop E2E gates release/* pushes and PRs and only informs
# main pushes and PRs (which may merge without it); broader verification belongs outside CI.
name: CI

on:
  pull_request:
    branches: [main, "release/*"]
    paths-ignore: ["website/**", ".github/workflows/website.yml"]
  push:
    branches: [main, "release/*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - run: cargo build --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/artifactize-desktop/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/artifactize-desktop/ui/pnpm-lock.yaml
      - working-directory: crates/artifactize-desktop/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo build --locked -p artifactize-desktop

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native platform contracts
        run: "cargo test --locked -p artifactize-core -p artifactize-tools --lib platform::"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native platform contracts
        run: "cargo test --locked -p artifactize-core -p artifactize-tools --lib platform::"

  desktop-e2e:
    name: Desktop E2E (${{ matrix.os }})
    # A failure blocks only release/* pushes and PRs into release/*.
    continue-on-error: ${{ !(startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'release/')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop and session dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev dbus-x11 xvfb xauth
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/artifactize-desktop/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/artifactize-desktop/ui/pnpm-lock.yaml
      - run: pnpm -C crates/artifactize-desktop/ui install --frozen-lockfile
      - run: pnpm -C crates/artifactize-desktop/ui test:automation
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-e2e
          cache-on-failure: true
      # The runner builds the E2E app and CLI, owns Linux D-Bus/Xvfb, and uses embedded WDIO.
      # Windows and macOS use the runner desktop; no external WebDriver is installed. In CI it
      # runs the whole suite, keeping each failed scenario's evidence for the upload below.
      - run: pnpm -C crates/artifactize-desktop/ui e2e
        env:
          DESKTOP_TEST_EVIDENCE: ${{ runner.temp }}/desktop-e2e-evidence
          DESKTOP_E2E_SHARED_TARGET_DIR: "1"
      - name: Upload the failed run's evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-e2e-evidence
          if-no-files-found: ignore
