name: Release

# Pushing a version tag (v0.5.2) releases that version. The tag must match the crate
# version. In order, and each step only after the previous one succeeds:
# 1. check the tag and run the tests;
# 2. build and smoke-test every release binary, and test the install scripts against
#    them (binaries.yml);
# 3. publish to crates.io, create the GitHub release and attach every archive and its
#    .sha256 checksum.
# A failed check or build publishes nothing. A new target or platform packager plugs
# into binaries.yml. A distribution channel (a Homebrew tap, winget, the Microsoft
# Store) is its own job with `needs: publish`, pointing at the attached assets, so
# one failing channel neither blocks nor undoes the others.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Tag and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "artifactize") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the crate version $version." >&2
            exit 1
          fi
      - run: cargo test --locked

  binaries:
    needs: check
    uses: ./.github/workflows/binaries.yml

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Check the archives and their checksums
        working-directory: dist
        run: |
          ls -l
          version=${GITHUB_REF_NAME#v}
          for file in *; do
            case $file in
              *.sha256) ;;
              "artifactize-v$version-"*) sha256sum -c "$file.sha256" ;;
              *) echo "$file is not an archive of version $version" >&2; exit 1 ;;
            esac
          done
      # crates.io Trusted Publishing: the crate trusts this workflow in environment
      # "release", so the job exchanges its OIDC token for a short-lived publish token.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        run: cargo publish --locked -p artifactize
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
      - name: Attach the archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*
