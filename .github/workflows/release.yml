name: Release

# Pushing a version tag releases it; the tag is the version, so no release needs a
# version-bump commit (main keeps a placeholder version):
#
#   git tag v0.5.4 && git push origin v0.5.4
#
# 1. The tests and the Linux builds run at the same time.
# 2. Once both pass, publish creates the GitHub release with the Linux archives and
#    their .sha256 checksums, so install.sh serves the new version, then publishes the
#    crate to crates.io. A failed test or Linux build publishes nothing.
# 3. The Windows zip and both macOS tarballs build alongside and are attached when
#    ready. Until v1 they are best effort: they never delay or fail the release.
#
# A prerelease tag (v0.6.0-alpha.1) creates a GitHub prerelease only: no crates.io.
# Homebrew, winget and Store follow stable releases only. Each optional channel has
# independent credentials and never gates the Linux release or another channel.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Read the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]." >&2
            exit 1
          fi
          case $version in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Shares ci.yml's cache, which pushes to main keep warm.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: false
      - run: cargo test --locked

  linux:
    needs: plan
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      platform: linux

  windows:
    needs: plan
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      platform: windows

  macos:
    needs: plan
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      platform: macos

  publish:
    needs: [plan, test, linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # crates.io Trusted Publishing
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Check the Linux archives and their checksums
        working-directory: dist
        run: |
          ls -l
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            sha256sum -c "artifactize-v$VERSION-$target.tar.gz.sha256"
          done
      - name: Create the GitHub release with the Linux archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=
          if [ "$PRERELEASE" = true ]; then flags=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes $flags dist/*
      - name: Set the version
        if: env.PRERELEASE == 'false'
        run: sh .github/scripts/set-version.sh "$VERSION"
      # crates.io Trusted Publishing: the crate trusts this workflow in environment
      # "release", so the job exchanges its OIDC token for a short-lived publish token.
      - uses: rust-lang/crates-io-auth-action@v1
        if: env.PRERELEASE == 'false'
        id: auth
      # The tests and the release builds already passed, so skip the verification
      # build. --allow-dirty: the version was set in this checkout.
      - name: Publish to crates.io
        if: env.PRERELEASE == 'false'
        run: |
          cargo publish --locked --allow-dirty --no-verify -p artifactize-tools
          cargo publish --locked --allow-dirty --no-verify -p artifactize
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  attach-windows:
    name: Attach the Windows zip (best effort)
    needs: [publish, windows]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries-x86_64-pc-windows-msvc
          path: dist
      - name: Attach the Windows zip and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c ./*.sha256
          gh release upload "$GITHUB_REF_NAME" ./*

  attach-macos:
    name: Attach the macOS tarballs (best effort)
    needs: [publish, macos]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist
      - name: Attach this macOS archive and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256
          gh release upload "$GITHUB_REF_NAME" ./*

  attach-channels:
    name: Attach winget manifests and unsigned Store upload (best effort)
    needs: [publish, windows]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: channels-windows
          path: channels
      - name: Bundle first-submission manifests
        run: zip -j channels/winget-manifests.zip channels/winget/*.yaml
      - name: Attach channel packages (including prereleases)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" channels/winget-manifests.zip channels/store/*

  homebrew:
    name: Update Homebrew tap (optional)
    needs: [plan, publish, attach-macos]
    runs-on: ubuntu-latest
    environment: release
    continue-on-error: true
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check channel policy and credentials
        id: gate
        run: python3 -I .github/scripts/channels.py gate homebrew --version "$VERSION"
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          pattern: binaries-*-apple-darwin
          path: dist
          merge-multiple: true
      - name: Generate and update the stable formula
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 -I .github/scripts/channels.py generate homebrew --version "$VERSION" --dist dist --output formula
          python3 -I .github/scripts/channels.py publish homebrew --version "$VERSION" --formula formula/artifactize.rb

  winget:
    name: Open winget-pkgs PR (optional)
    needs: [plan, publish, attach-windows, attach-channels]
    runs-on: windows-latest
    environment: release
    continue-on-error: true
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check channel policy and credentials
        id: gate
        run: python -I .github/scripts/channels.py gate winget --version $env:VERSION
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: channels-windows
          path: channels
      - name: Install maintained winget manifest creator
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          # The standalone executable is Microsoft's documented CI distribution.
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/wingetcreate" -Force | Out-Null
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile "$env:RUNNER_TEMP/wingetcreate/wingetcreate.exe"
          "$env:RUNNER_TEMP/wingetcreate" >> $env:GITHUB_PATH
      - name: Submit the generated manifest set
        if: steps.gate.outputs.enabled == 'true'
        run: python -I .github/scripts/channels.py publish winget --version $env:VERSION --manifests channels/winget

  store:
    name: Submit Store update unless a submission is pending (optional)
    needs: [plan, publish, attach-channels]
    runs-on: ubuntu-latest
    environment: release
    continue-on-error: true
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
      STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check channel policy and credentials
        id: gate
        run: python3 -I .github/scripts/channels.py gate store --version "$VERSION"
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: channels-windows
          path: channels
      - name: Submit through the Microsoft Store submission API
        if: steps.gate.outputs.enabled == 'true'
        run: python3 -I .github/scripts/channels.py publish store --version "$VERSION" --package "channels/store/artifactize-v$VERSION-x64.msixupload"
