name: Release

# Pushing a version tag (v0.5.0) publishes that version to crates.io and creates its
# GitHub release. The tag must match the crate version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "artifactize") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the crate version $version." >&2
            exit 1
          fi
      - run: cargo test --locked
      # Trusted Publishing needs the crate to exist on crates.io. Until it is set up, a
      # CARGO_REGISTRY_TOKEN repository secret publishes instead; delete the secret once
      # the crate's Trusted Publisher (this workflow, environment "release") is configured.
      - name: Choose the crates.io credential
        id: credential
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "Publishing with the CARGO_REGISTRY_TOKEN secret."
            echo "source=secret" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing with crates.io Trusted Publishing."
            echo "source=trusted" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.credential.outputs.source == 'trusted'
      - name: Publish to crates.io
        run: cargo publish --locked -p artifactize
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
