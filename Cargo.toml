[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/artifactize-desktop/vendor/tauri-plugin-wdio-webdriver"]
# Plain `cargo build/clippy/test` at the root cover the CLI and its tools. The desktop app
# needs WebKitGTK and a built frontend, so it builds only when named (`-p artifactize-desktop`)
# and has its own CI job; the CLI's builds, releases and lockfile versions stay as they were.
default-members = ["crates/artifactize", "crates/artifactize-core", "crates/artifactize-tools", "crates/artifactize-tui", "crates/artifactize-mcp"]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lhj6102/artifactize"
homepage = "https://artifactize.dev"

# The release version script updates both this publish dependency and the workspace version.
[workspace.dependencies.artifactize-core]
version = "0.0.0-dev"
path = "crates/artifactize-core"

[workspace.dependencies.artifactize-mcp]
version = "0.0.0-dev"
path = "crates/artifactize-mcp"

[workspace.dependencies.artifactize-tui]
version = "0.0.0-dev"
path = "crates/artifactize-tui"

[workspace.dependencies.artifactize-tools]
version = "0.0.0-dev"
path = "crates/artifactize-tools"

# The desktop e2e feature is the only consumer of this test-only input correction.
[patch.crates-io]
tauri-plugin-wdio-webdriver = { path = "crates/artifactize-desktop/vendor/tauri-plugin-wdio-webdriver" }
