[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo build/clippy/test` at the root cover the CLI and its tools. The desktop app
# needs WebKitGTK and a built frontend, so it builds only when named (`-p artifactize-desktop`)
# and has its own CI job; the CLI's builds, releases and lockfile versions stay as they were.
default-members = ["crates/artifactize", "crates/artifactize-tools"]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
# rig-core 0.43 needs 1.95; clippy's incompatible_msrv lint holds the code to it.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/lhj6102/artifactize"
homepage = "https://artifactize.dev"

# The release version script updates both this publish dependency and the workspace version.
[workspace.dependencies.artifactize-tools]
version = "0.0.0-dev"
path = "crates/artifactize-tools"
