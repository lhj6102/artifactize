<!doctype html>
<!-- Who does the work around Artifactize: how people and AI agents share directing, building
     and evaluating. capture.mts renders it into roles.en.png; the README and the landing page use
     that image. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roles of people and agents</title>
<!-- The landing page's brand fonts and the brand icon; capture.mts serves them at /fonts/ and
     /brand/. -->
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root {
    --bg: #F7F9FC;
    --line: #D9DFE8;
    --text: #0F141B;
    --agent: #7C3AED;
    --human: #C26A0A;
    --display: 'Space Grotesk', 'Pretendard Variable', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--text); }

  .figure {
    position: relative;
    width: 1440px;
    height: 600px;
    background: var(--bg);
  }

  .links {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .links path { fill: none; stroke: var(--line); stroke-width: 2.4; stroke-linecap: round; }

  /* ---------- Artifactize in the middle ---------- */

  .center {
    position: absolute;
    left: 520px;
    top: 250px;
    width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .center img { width: 220px; height: 220px; }
  .center p {
    margin: 10px 0 0;
    font: 700 52px/1 var(--display);
    letter-spacing: -0.03em;
  }

  /* ---------- The roles around it ---------- */

  .role {
    position: absolute;
    width: 440px;
    text-align: center;
  }
  .role.director { left: 500px; top: 56px; }
  .role.builder { left: 70px; top: 264px; }
  .role.evaluator { left: 930px; top: 264px; }
  .role h2 {
    margin: 0 0 22px;
    font: 700 56px/1 var(--display);
    letter-spacing: -0.03em;
  }

  /* One bar per role: each share is as wide as its part of the role, but never narrower than
     its icon, and shows who takes it. */
  .bar {
    display: flex;
    gap: 6px;
    height: 56px;
  }
  .bar span {
    display: grid;
    place-items: center;
    min-width: 56px;
    border-radius: 28px;
    color: #FFFFFF;
  }
  .bar .human { background: var(--human); }
  .bar .agent { background: var(--agent); }
  .bar svg { width: 32px; height: 32px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-person" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/></g></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></g></symbol>
  </defs>
</svg>

<div class="figure">
  <!-- Each role joins Artifactize: from the Director's bar down, and from the Builder's and the
       Evaluator's bars in. -->
  <svg class="links" viewBox="0 0 1440 600" aria-hidden="true">
    <path d="M720 206 V282"/>
    <path d="M526 370 H628"/>
    <path d="M816 370 H914"/>
  </svg>

  <section class="role director">
    <h2>Director</h2>
    <div class="bar">
      <span class="human" style="flex:50"><svg><use href="#i-person"/></svg></span>
      <span class="agent" style="flex:50"><svg><use href="#i-agent"/></svg></span>
    </div>
  </section>

  <section class="role builder">
    <h2>Builder</h2>
    <div class="bar">
      <span class="agent" style="flex:100"><svg><use href="#i-agent"/></svg></span>
    </div>
  </section>

  <section class="role evaluator">
    <h2>Evaluator</h2>
    <div class="bar">
      <span class="agent" style="flex:90"><svg><use href="#i-agent"/></svg></span>
      <span class="human" style="flex:10"><svg><use href="#i-person"/></svg></span>
    </div>
  </section>

  <div class="center">
    <img src="/brand/artifactize-icon.svg" alt="">
    <p>Artifactize</p>
  </div>
</div>

<script>
  // capture.mts waits for this before taking the picture.
  document.fonts.ready.then(() => { document.documentElement.dataset.ready = "en"; });
</script>
</body>
</html>
