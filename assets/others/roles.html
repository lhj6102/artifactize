<!doctype html>
<!-- Who does the work: how people and AI agents share directing, building and evaluating.
     capture.mts renders it into roles.en.png; the README and the landing page use that image. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roles of people and agents</title>
<!-- The landing page's brand fonts; capture.mts serves them at /fonts/. -->
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root {
    --bg: #F7F9FC;
    --text: #0F141B;
    --agent: #7C3AED;
    --human: #C26A0A;
    --display: 'Space Grotesk', 'Pretendard Variable', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--text); }

  .figure {
    display: grid;
    grid-template-columns: 300px 1fr;
    align-content: center;
    row-gap: 44px;
    width: 1200px;
    height: 480px;
    padding: 0 80px;
    background: var(--bg);
  }

  h2 {
    margin: 0;
    align-self: center;
    font: 700 52px/1 var(--display);
    letter-spacing: -0.03em;
  }

  /* One bar per role: each share is as wide as its part of the role and shows who takes it. */
  .bar {
    display: flex;
    gap: 6px;
    height: 76px;
  }
  .bar span {
    display: grid;
    place-items: center;
    border-radius: 38px;
    color: #FFFFFF;
  }
  .bar .human { background: var(--human); }
  .bar .agent { background: var(--agent); }
  .bar svg { width: 40px; height: 40px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-person" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/></g></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></g></symbol>
  </defs>
</svg>

<div class="figure">
  <h2>Director</h2>
  <div class="bar">
    <span class="human" style="flex:50"><svg><use href="#i-person"/></svg></span>
    <span class="agent" style="flex:50"><svg><use href="#i-agent"/></svg></span>
  </div>

  <h2>Builder</h2>
  <div class="bar">
    <span class="agent" style="flex:100"><svg><use href="#i-agent"/></svg></span>
  </div>

  <h2>Evaluator</h2>
  <div class="bar">
    <span class="agent" style="flex:90"><svg><use href="#i-agent"/></svg></span>
    <span class="human" style="flex:10"><svg><use href="#i-person"/></svg></span>
  </div>
</div>

<script>
  // capture.mts waits for this before taking the picture.
  document.fonts.ready.then(() => { document.documentElement.dataset.ready = "en"; });
</script>
</body>
</html>
