<!doctype html>
<!-- Collaborate in Artifactize, in motion: one Artifact Graph passed between three roles, each
     with its team of five people and AI agents. The Director adds to the graph, the Builder
     builds it and the Evaluator checks it node by node; a RED sends it back to the Builder, and
     the fixed node is checked again until GREEN. Then the Director adds a node and changes
     another, and the Builder and the Evaluator go back and forth again. The graph is abstract:
     one node on the left fanning out to the right, nothing around them. A node is dashed when new or changed,
     white when built, then GREEN or RED once checked. The scene is 16:9 and a
     pure function of time, figure.frame(t), so capture.mts renders the same frames every time
     into roles.en.gif; opened directly, the page plays itself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collaborate in Artifactize</title>
<!-- The landing page's brand fonts and the brand icon; capture.mts serves them at /fonts/ and
     /brand/. -->
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  /* The landing page's dark theme. */
  :root {
    --bg: #090B0F;
    --text: #EAF0F7;
    --dim: #8B96A8;
    --display: 'Space Grotesk', 'Pretendard Variable', sans-serif;
    --sans: 'Pretendard Variable', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  html, body { margin: 0; background: var(--bg); }
  svg.scene { display: block; width: 1440px; height: 810px; }
  .title { fill: var(--text); font: 700 54px var(--display); letter-spacing: -0.03em; }
  .kicker { fill: var(--dim); font: 500 28px var(--sans); }
  .brand { fill: var(--text); font: 700 42px var(--display); letter-spacing: -0.03em; }
  .edge { fill: none; stroke: #4A5568; stroke-width: 3; marker-end: url(#arrow); }
  .tag-text { font: 700 22px var(--mono); }
</style>
</head>
<body>
<svg class="scene" viewBox="0 0 1440 810" aria-hidden="true">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1.5 9 5 1 8.5Z" fill="#4A5568"/></marker>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="i-person" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/></g></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></g></symbol>
  </defs>

  <!-- The three roles. -->
  <text class="title" x="720" y="76" text-anchor="middle">Director</text>
  <text class="title" x="165" y="452" text-anchor="middle">Builder</text>
  <text class="title" x="1275" y="452" text-anchor="middle">Evaluator</text>
  <g id="teams"></g>

  <!-- The Artifact Graph, and the tag naming what it is passed for. -->
  <g id="graph">
    <g id="edges"></g>
    <g id="nodes"></g>
  </g>
  <g id="tag">
    <rect id="tag-box" y="-21" height="42" rx="21"/>
    <text id="tag-text" class="tag-text" y="8" text-anchor="middle" fill="#090B0F"></text>
  </g>

  <!-- The logo along the bottom. -->
  <g id="logo">
    <text class="kicker" id="logo-kicker" y="750">Collaborate in</text>
    <image id="logo-icon" href="/brand/artifactize-icon.svg" y="704" width="60" height="60"/>
    <text class="brand" id="logo-name" y="752">Artifactize</text>
  </g>
</svg>

<script>
  const SVG = "http://www.w3.org/2000/svg";
  /** The loop's length in seconds. */
  const SECONDS = 19;
  const COLOURS = { person: "#F5B84B", agent: "#B49CFF" };

  // ---------- The story, second by second ----------

  /** Where the graph rests beside each role. */
  const SPOTS = { director: { x: 720, y: 360 }, builder: { x: 530, y: 505 }, evaluator: { x: 910, y: 505 } };
  /** The passes: from one role to another between `start` and `end`, tagged with why. */
  const PASSES = [
    { from: "director", to: "builder", start: 1.4, end: 2.2, tag: "build" },
    { from: "builder", to: "evaluator", start: 3.2, end: 4.0, tag: "verify" },
    { from: "evaluator", to: "builder", start: 5.8, end: 6.6, tag: "RED" },
    { from: "builder", to: "evaluator", start: 7.4, end: 8.2, tag: "verify" },
    { from: "evaluator", to: "director", start: 9.0, end: 9.8, tag: "GREEN" },
    { from: "director", to: "builder", start: 10.8, end: 11.6, tag: "build" },
    { from: "builder", to: "evaluator", start: 12.6, end: 13.4, tag: "verify" },
    { from: "evaluator", to: "builder", start: 14.5, end: 15.3, tag: "RED" },
    { from: "builder", to: "evaluator", start: 16.0, end: 16.8, tag: "verify" },
    { from: "evaluator", to: "director", start: 17.5, end: 18.3, tag: "GREEN" },
  ];
  const TAGS = { build: "#B49CFF", verify: "#6AA8FF", RED: "#FF5D5D", GREEN: "#3EE08F" };

  /** The graph's nodes, one on the left fanning out to the right, and each one's states over the
   * loop: five built at the start, a leaf added in each round, and a branch changed in the
   * second. The Evaluator checks them column by column. At the loop's end everything returns to the first state, so
   * the loop starts again. */
  const NODES = {
    a: { x: -115, y: 0, states: [[0, "built"], [4.15, "green"], [18.3, "built"]] },
    b: { x: -5, y: -62, states: [[0, "built"], [4.4, "green"], [10.5, "new"], [12.0, "built"], [13.8, "green"], [18.3, "built"]] },
    c: { x: -5, y: 62, states: [[0, "built"], [4.65, "green"], [18.3, "built"]] },
    d: { x: 115, y: -96, states: [[0, "built"], [4.9, "green"], [18.3, "built"]] },
    e: { x: 115, y: -32, states: [[0, "built"], [5.15, "green"], [18.3, "built"]] },
    f: { x: 115, y: 32, states: [[0, "hidden"], [0.9, "new"], [2.8, "built"], [5.45, "red"], [7.1, "built"], [8.6, "green"], [18.3, "hidden"]] },
    g: { x: 115, y: 96, states: [[0, "hidden"], [10.1, "new"], [12.3, "built"], [14.2, "red"], [15.7, "built"], [17.1, "green"], [18.3, "hidden"]] },
  };
  /** The graph is drawn this much larger than its coordinates. */
  const GRAPH_SCALE = 1.25;
  const EDGES = [["a", "b"], ["a", "c"], ["b", "d"], ["b", "e"], ["c", "f"], ["c", "g"]];
  const RADIUS = 22;
  /** How each state looks: fill, outline, and whether the outline is dashed. */
  const LOOKS = {
    hidden: { fill: "#090B0F", stroke: "#090B0F", opacity: 0 },
    new: { fill: "#090B0F", stroke: "#8B96A8", opacity: 1, dashed: true },
    built: { fill: "#EAF0F7", stroke: "#EAF0F7", opacity: 1 },
    green: { fill: "#3EE08F", stroke: "#3EE08F", opacity: 1 },
    red: { fill: "#FF5D5D", stroke: "#FF5D5D", opacity: 1 },
  };

  /** When each team works: [role, first member's start, step between members, members]. The
   * person on the Evaluator signs off each GREEN that ends a round. */
  const WORK = [
    ["director", 0.5, 0.1, [0, 1, 2, 3, 4]],
    ["builder", 2.3, 0.14, [0, 1, 2, 3, 4]],
    ["evaluator", 4.0, 0.36, [0, 1, 2, 3]],
    ["builder", 6.65, 0.1, [0, 1, 2, 3, 4]],
    ["evaluator", 8.25, 0.08, [0, 1, 2, 3]],
    ["evaluator", 8.4, 0, [4]],
    ["director", 9.9, 0.1, [0, 1, 2, 3, 4]],
    ["builder", 11.65, 0.14, [0, 1, 2, 3, 4]],
    ["evaluator", 13.45, 0.35, [0, 1, 2, 3]],
    ["builder", 15.35, 0.1, [0, 1, 2, 3, 4]],
    ["evaluator", 16.85, 0.08, [0, 1, 2, 3]],
    ["evaluator", 16.95, 0, [4]],
  ];

  // ---------- Building the scene ----------

  const make = (name, attributes, parent) => {
    const element = document.createElementNS(SVG, name);
    for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
    parent?.append(element);
    return element;
  };
  const byId = (id) => document.getElementById(id);

  /** Each role's team, left to right, at the centre of its row. */
  const TEAMS = {
    director: { x: 720, y: 138, members: ["person", "person", "person", "agent", "agent"] },
    builder: { x: 165, y: 514, members: ["agent", "agent", "agent", "agent", "agent"] },
    evaluator: { x: 1275, y: 514, members: ["agent", "agent", "agent", "agent", "person"] },
  };
  const badges = {};
  for (const [role, team] of Object.entries(TEAMS)) {
    badges[role] = team.members.map((kind, index) => {
      const x = team.x + (index - 2) * 64;
      const group = make("g", { transform: `translate(${x} ${team.y})`, color: COLOURS[kind] }, byId("teams"));
      const pulse = make("circle", { r: 25, fill: "none", stroke: COLOURS[kind], "stroke-width": 2, opacity: 0 }, group);
      const disc = make("circle", { r: 25, fill: "#10141B", stroke: COLOURS[kind], "stroke-width": 2 }, group);
      make("use", { href: kind === "person" ? "#i-person" : "#i-agent", x: -14, y: -14, width: 28, height: 28 }, group);
      return { kind, group, pulse, disc };
    });
  }

  // Each link is one bend: it leaves its node towards the next one's row and enters that node
  // level from the left.
  const edges = EDGES.map(([from, to]) => {
    const [a, b] = [NODES[from], NODES[to]];
    const bend = { x: a.x + 0.3 * (b.x - a.x), y: b.y };
    const away = Math.hypot(bend.x - a.x, bend.y - a.y);
    const start = { x: a.x + ((RADIUS + 3) * (bend.x - a.x)) / away, y: a.y + ((RADIUS + 3) * (bend.y - a.y)) / away };
    const end = { x: b.x - RADIUS - 4, y: b.y };
    return { from, to, line: make("path", { class: "edge", d: `M${start.x.toFixed(2)} ${start.y.toFixed(2)} Q ${bend.x} ${bend.y} ${end.x} ${end.y}` }, byId("edges")) };
  });
  for (const node of Object.values(NODES)) {
    node.group = make("g", { transform: `translate(${node.x} ${node.y})` }, byId("nodes"));
    node.ring = make("circle", { r: 33, fill: "none", stroke: "#6AA8FF", "stroke-width": 3, opacity: 0 }, node.group);
    node.dot = make("circle", { r: RADIUS, "stroke-width": 3 }, node.group);
  }

  // ---------- Motion ----------

  const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2);
  const progress = (t, start, end) => ease(Math.min(Math.max((t - start) / (end - start), 0), 1));
  /** A soft rise and fall, 0 outside [start, start + width]. */
  const bump = (t, start, width) => {
    const x = (t - start) / width;
    return x <= 0 || x >= 1 ? 0 : Math.sin(Math.PI * x);
  };
  const channels = (hex) => [1, 3, 5].map((index) => parseInt(hex.slice(index, index + 2), 16));
  const mix = (a, b, x) => {
    const [from, to] = [channels(a), channels(b)];
    return `rgb(${from.map((value, index) => Math.round(value + (to[index] - value) * x)).join(",")})`;
  };

  /** Where the graph is at `t`: resting beside a role, or gliding along a low arc to the next. */
  function graph(t) {
    const pass = PASSES.find((candidate) => t >= candidate.start && t < candidate.end);
    if (!pass) {
      const last = [...PASSES].reverse().find((candidate) => t >= candidate.end) ?? PASSES.at(-1);
      return { ...SPOTS[last.to], pass: null };
    }
    const x = progress(t, pass.start, pass.end);
    const [a, b] = [SPOTS[pass.from], SPOTS[pass.to]];
    const control = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - 40 };
    const point = {
      x: (1 - x) ** 2 * a.x + 2 * (1 - x) * x * control.x + x ** 2 * b.x,
      y: (1 - x) ** 2 * a.y + 2 * (1 - x) * x * control.y + x ** 2 * b.y,
    };
    return { ...point, pass, lift: Math.sin(Math.PI * x) };
  }

  /** A node's look at `t`: its state, blended into the next over a quarter second (the loop's
   * final return over 0.7 s), with a blue ring while it is being checked. */
  function look(node, t) {
    let index = 0;
    node.states.forEach(([start], i) => { if (t >= start) index = i; });
    const [start, state] = node.states[index];
    const before = LOOKS[index > 0 ? node.states[index - 1][1] : state];
    const after = LOOKS[state];
    const turn = Math.min((t - start) / (start >= 18 ? 0.7 : 0.25), 1);
    const checked = state === "green" || state === "red";
    return {
      fill: mix(before.fill, after.fill, turn),
      stroke: mix(before.stroke, after.stroke, turn),
      opacity: before.opacity + (after.opacity - before.opacity) * turn,
      dashed: after.dashed && turn > 0.5,
      ring: checked && start < 18 ? bump(t, start - 0.3, 0.55) : 0,
      pop: state === "new" && before.opacity === 0 ? 0.6 + 0.4 * turn : 1,
    };
  }

  /** Draw the scene at `t` seconds into the loop. */
  function frame(t) {
    t = ((t % SECONDS) + SECONDS) % SECONDS;

    const place = graph(t);
    byId("graph").setAttribute("transform", `translate(${place.x.toFixed(2)} ${place.y.toFixed(2)}) scale(${GRAPH_SCALE})`);
    const tag = byId("tag");
    tag.setAttribute("display", place.pass ? "inline" : "none");
    if (place.pass) {
      const text = byId("tag-text");
      text.textContent = place.pass.tag;
      const width = text.getComputedTextLength() + 36;
      const box = byId("tag-box");
      box.setAttribute("x", (-width / 2).toFixed(2));
      box.setAttribute("width", width.toFixed(2));
      box.setAttribute("fill", TAGS[place.pass.tag]);
      tag.setAttribute("transform", `translate(${place.x.toFixed(2)} ${(place.y - 186).toFixed(2)})`);
      tag.setAttribute("opacity", Math.min(1, place.lift * 2.5).toFixed(3));
    }

    const looks = {};
    for (const [key, node] of Object.entries(NODES)) {
      const now = look(node, t);
      looks[key] = now;
      node.group.setAttribute("opacity", now.opacity.toFixed(3));
      node.group.setAttribute("transform", `translate(${node.x} ${node.y}) scale(${now.pop.toFixed(3)})`);
      node.dot.setAttribute("fill", now.fill);
      node.dot.setAttribute("stroke", now.stroke);
      node.dot.setAttribute("stroke-dasharray", now.dashed ? "6 5" : "none");
      node.ring.setAttribute("opacity", now.ring.toFixed(3));
    }
    for (const edge of edges) edge.line.setAttribute("opacity", Math.min(looks[edge.from].opacity, looks[edge.to].opacity).toFixed(3));

    // Teams light up while they work.
    const glow = { director: [0, 0, 0, 0, 0], builder: [0, 0, 0, 0, 0], evaluator: [0, 0, 0, 0, 0] };
    for (const [role, start, step, members] of WORK) {
      members.forEach((member, order) => {
        glow[role][member] = Math.max(glow[role][member], bump(t, start + order * step, member === 4 && role === "evaluator" ? 0.7 : 0.5));
      });
    }
    for (const [role, team] of Object.entries(badges)) {
      team.forEach((badge, i) => {
        const x = glow[role][i];
        badge.disc.setAttribute("fill", mix("#10141B", badge.kind === "person" ? "#4A3510" : "#2E2550", x));
        badge.group.setAttribute("filter", x > 0.05 ? "url(#glow)" : "none");
        badge.pulse.setAttribute("r", (25 + 6 * x).toFixed(2));
        badge.pulse.setAttribute("opacity", (0.6 * x).toFixed(3));
      });
    }
  }

  /** Centre the logo: "Collaborate in", the icon and the name side by side. */
  function placeLogo() {
    const kicker = byId("logo-kicker");
    const name = byId("logo-name");
    const [gap, icon] = [14, 60];
    const width = kicker.getComputedTextLength() + gap + icon + gap + name.getComputedTextLength();
    const left = 720 - width / 2;
    kicker.setAttribute("x", left.toFixed(2));
    byId("logo-icon").setAttribute("x", (left + kicker.getComputedTextLength() + gap).toFixed(2));
    name.setAttribute("x", (left + kicker.getComputedTextLength() + gap + icon + gap).toFixed(2));
  }

  // Opened directly, the page plays; capture.mts stops it and draws each frame itself.
  let playing = requestAnimationFrame(function play(now) {
    frame(now / 1000);
    playing = requestAnimationFrame(play);
  });
  window.figure = {
    seconds: SECONDS,
    frame,
    stop() { cancelAnimationFrame(playing); },
  };

  // capture.mts waits for this before taking the pictures: the fonts and the icon are in.
  const icon = new Image();
  icon.src = "/brand/artifactize-icon.svg";
  Promise.all([document.fonts.ready, icon.decode()]).then(() => {
    placeLogo();
    document.documentElement.dataset.ready = "en";
  });
</script>
</body>
</html>
