<!doctype html>
<!-- Collaborating in Artifactize: the work splits into three roles around it, and each role
     shows its team of five, people and AI agents. capture.mts renders it into
     roles.en.png; the README and the landing page use that image. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collaborate in Artifactize</title>
<!-- The landing page's brand fonts and the brand icon; capture.mts serves them at /fonts/ and
     /brand/. -->
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root {
    --bg: #F7F9FC;
    --line: #D9DFE8;
    --text: #0F141B;
    --dim: #586276;
    --agent: #7C3AED;
    --agent-tint: #F1EAFE;
    --human: #C26A0A;
    --human-tint: #FFF4E6;
    --display: 'Space Grotesk', 'Pretendard Variable', sans-serif;
    --sans: 'Pretendard Variable', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--text); }

  .figure {
    position: relative;
    width: 1440px;
    height: 600px;
    background: var(--bg);
  }

  .links {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .links path { fill: none; stroke: var(--line); stroke-width: 2.4; stroke-linecap: round; }

  /* ---------- Artifactize in the middle ---------- */

  .center {
    position: absolute;
    left: 520px;
    top: 262px;
    width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .center img { width: 200px; height: 200px; }
  .center small {
    margin-top: 8px;
    color: var(--dim);
    font: 500 24px/1 var(--sans);
  }
  .center p {
    margin: 8px 0 0;
    font: 700 52px/1 var(--display);
    letter-spacing: -0.03em;
  }

  /* ---------- The three roles around it ---------- */

  .role {
    position: absolute;
    width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .role.director { left: 520px; top: 44px; }
  .role.builder { left: 110px; top: 286px; }
  .role.evaluator { left: 930px; top: 286px; }
  .role h2 {
    margin: 0;
    font: 700 56px/1 var(--display);
    letter-spacing: -0.03em;
  }
  .role p {
    margin: 12px 0 0;
    color: var(--dim);
    font: 500 24px/1 var(--sans);
  }

  /* The team that takes the role: five members, people and AI agents. */
  .who {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .who span {
    display: grid;
    place-items: center;
    width: 60px;
    height: 60px;
    border: 2.6px solid currentColor;
    border-radius: 50%;
  }
  .who .human { color: var(--human); background: var(--human-tint); }
  .who .agent { color: var(--agent); background: var(--agent-tint); }
  .who svg { width: 32px; height: 32px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-person" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/></g></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></g></symbol>
  </defs>
</svg>

<div class="figure">
  <!-- Each role joins Artifactize: the Director from above, the Builder and the Evaluator from
       either side. -->
  <svg class="links" viewBox="0 0 1440 600" aria-hidden="true">
    <path d="M720 228 V292"/>
    <path d="M480 370 H630"/>
    <path d="M814 370 H960"/>
  </svg>

  <section class="role director">
    <h2>Director</h2>
    <p>Decides what to build</p>
    <div class="who">
      <span class="human"><svg><use href="#i-person"/></svg></span>
      <span class="human"><svg><use href="#i-person"/></svg></span>
      <span class="human"><svg><use href="#i-person"/></svg></span>
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
    </div>
  </section>

  <section class="role builder">
    <h2>Builder</h2>
    <p>Builds the pieces</p>
    <div class="who">
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
    </div>
  </section>

  <section class="role evaluator">
    <h2>Evaluator</h2>
    <p>Checks each piece</p>
    <div class="who">
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
      <span class="agent"><svg><use href="#i-agent"/></svg></span>
      <span class="human"><svg><use href="#i-person"/></svg></span>
    </div>
  </section>

  <div class="center">
    <img src="/brand/artifactize-icon.svg" alt="">
    <small>Collaborate in</small>
    <p>Artifactize</p>
  </div>
</div>

<script>
  // capture.mts waits for this before taking the picture.
  document.fonts.ready.then(() => { document.documentElement.dataset.ready = "en"; });
</script>
</body>
</html>
