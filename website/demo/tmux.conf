# tmux for the two-terminal demos: no status bar, titled panes in the brand colors.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 0
set -g status off
set -g mouse off
set -g default-command "bash --noprofile --rcfile /home/alice/.pane-rc -i"
set -g pane-border-status top
set -g pane-border-style "fg=#262E3B"
set -g pane-active-border-style "fg=#3EE08F"
set -g pane-border-format " #{?pane_active,#[fg=#3EE08F bold],#[fg=#8B96A8]}#{pane_title}#[default] "
