# The artifactize docs, served at https://artifactize.dev/docs/.
# Built by website/build.sh with the mdBook version pinned there.
[book]
title = "Artifactize docs"
description = "The AI-native collaboration layer for one-of-a-kind teammates and their agents: Artifacts with their own evals, and every review reused while it still holds."
authors = ["Hyukjin LIM"]
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
site-url = "/docs/"
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/lhj6102/artifactize"
no-section-label = true
additional-css = ["theme/artifactize.css"]

[output.html.print]
enable = true

[output.html.search]
enable = true

# Keep published documentation URLs usable after grouping by endpoint.
[output.html.redirect]
"guides/hey-arti.html" = "/docs/agent-plugin/hey-arti.html"
"reference/mcp.html" = "/docs/agent-plugin/mcp.html"
"reference/cli.html" = "/docs/cli/index.html"
"guides/agent-evals.html" = "/docs/features/agent.html"
"concepts/artifacts-and-evals.html" = "/docs/features/artifact.html"
"reference/declarations.html" = "/docs/features/declarations.html"
"concepts/fingerprints-and-reuse.html" = "/docs/features/fingerprint.html"
"guides/human-reviews.html" = "/docs/features/human.html"
"reference/platforms.html" = "/docs/features/others/platforms.html"
"reference/overview.html" = "/docs/features/others/reference.html"
"reference/state-cache-limits.html" = "/docs/features/others/state.html"
"concepts/runs-and-status.html" = "/docs/features/run.html"
"guides/ci.html" = "/docs/features/team/ci.html"
"guides/team-review-store.html" = "/docs/features/team/index.html"
"reference/review-store.html" = "/docs/features/team/reference.html"
"guides/team-walkthrough.html" = "/docs/features/team/walkthrough.html"
"reference/agent-tools.html" = "/docs/features/tools/agent.html"
"reference/builtin-tools.html" = "/docs/features/tools/builtin.html"
"reference/human-tools.html" = "/docs/features/tools/human.html"
"getting-started/quick-start.html" = "/docs/getting-started/guide.html"
"introduction.html" = "/docs/getting-started/intro.html"
