# The English artifactize docs, served at https://artifactize.dev/docs/.
# Built by website/build.sh with the mdBook version pinned there and the
# shared theme in ../theme/; the Korean translation lives in ../ko/.
[book]
title = "Artifactize docs"
description = "Artifactize: Evaluation-driven development for people and AI agents. Declare Artifacts with their own evals, and reuse every review while its inputs still match."
authors = ["Hyukjin LIM"]
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
site-url = "/docs/"
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/lhj6102/artifactize"
no-section-label = true
additional-css = ["theme/artifactize.css"]

[output.html.print]
enable = true

[output.html.search]
enable = true

# Keep published documentation URLs usable after reorganizing chapters.
[output.html.redirect]
"introduction.html" = "/docs/getting-started/intro.html"
"getting-started/quick-start.html" = "/docs/getting-started/guide.html"
"getting-started/install-options.html" = "/docs/getting-started/install.html"
