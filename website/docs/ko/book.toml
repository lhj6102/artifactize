# The Korean artifactize docs, served at https://artifactize.dev/docs/ko/.
# A translation of ../en/ with the same chapter paths; built by website/build.sh
# with the shared theme in ../theme/.
[book]
title = "Artifactize 문서"
description = "저마다 다르게 일하는 팀원들이 에이전트와 함께 협업하도록 돕는 AI 네이티브 도구입니다. Artifact마다 eval을 두고, 모든 리뷰는 유효한 동안 재사용합니다."
authors = ["Hyukjin LIM"]
language = "ko"
src = "src"

[build]
create-missing = false

[output.html]
site-url = "/docs/ko/"
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/lhj6102/artifactize"
no-section-label = true
additional-css = ["theme/artifactize.css"]

[output.html.print]
enable = true

[output.html.search]
enable = true

[output.html.redirect]
"guides/hey-arti.html" = "/docs/ko/agent-plugin/hey-arti.html"
"reference/mcp.html" = "/docs/ko/agent-plugin/mcp.html"
"reference/cli.html" = "/docs/ko/cli/index.html"
"guides/agent-evals.html" = "/docs/ko/features/agent.html"
"concepts/artifacts-and-evals.html" = "/docs/ko/features/artifact.html"
"reference/declarations.html" = "/docs/ko/features/declarations.html"
"concepts/fingerprints-and-reuse.html" = "/docs/ko/features/fingerprint.html"
"guides/human-reviews.html" = "/docs/ko/features/human.html"
"reference/platforms.html" = "/docs/ko/features/others/platforms.html"
"reference/overview.html" = "/docs/ko/features/others/reference.html"
"reference/state-cache-limits.html" = "/docs/ko/features/others/state.html"
"concepts/runs-and-status.html" = "/docs/ko/features/run.html"
"guides/ci.html" = "/docs/ko/features/team/ci.html"
"guides/team-review-store.html" = "/docs/ko/features/team/index.html"
"reference/review-store.html" = "/docs/ko/cli/review-store.html"
"features/team/reference.html" = "/docs/ko/cli/review-store.html"
"guides/team-walkthrough.html" = "/docs/ko/features/team/walkthrough.html"
"reference/agent-tools.html" = "/docs/ko/features/tools/agent.html"
