# The Korean artifactize docs, served at https://artifactize.dev/docs/ko/.
# A translation of ../en/ with the same chapter paths; built by website/build.sh
# with the shared theme in ../theme/.
[book]
title = "Artifactize 문서"
description = "Artifactize: Evaluation-driven development for people and AI agents. 프로젝트 구성 요소마다 eval을 선언하고, 입력이 바뀌지 않은 리뷰를 재사용합니다."
authors = ["Hyukjin LIM"]
language = "ko"
src = "src"

[build]
create-missing = false

[output.html]
site-url = "/docs/ko/"
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/lhj6102/artifactize"
no-section-label = true
additional-css = ["theme/artifactize.css"]

[output.html.print]
enable = true

[output.html.search]
enable = true

[output.html.redirect]
"introduction.html" = "/docs/ko/getting-started/intro.html"
"getting-started/quick-start.html" = "/docs/ko/getting-started/guide.html"
