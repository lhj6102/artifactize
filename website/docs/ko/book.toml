# The Korean artifactize docs, served at https://artifactize.dev/docs/ko/.
# A translation of ../en/ with the same chapter paths; built by website/build.sh
# with the shared theme in ../theme/.
[book]
title = "Artifactize 문서"
description = "팀과 에이전트가 서로 다른 방식으로 일하면서도 협업할 수 있게 돕는 AI 네이티브 도구입니다. Artifact마다 eval을 선언하고, 유효한 리뷰 결과는 재사용합니다."
authors = ["Hyukjin LIM"]
language = "ko"
src = "src"

[build]
create-missing = false

[output.html]
site-url = "/docs/ko/"
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/lhj6102/artifactize"
no-section-label = true
additional-css = ["theme/artifactize.css"]

[output.html.print]
enable = true

[output.html.search]
enable = true

[output.html.redirect]
"features/team/reference.html" = "/docs/ko/cli/review-store.html"
