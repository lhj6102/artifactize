# Cloudflare Workers static assets for artifactize.dev.
# Deployed by .github/workflows/website.yml; see website/README.md.
name = "artifactize-site"
compatibility_date = "2026-10-01"
routes = [{ pattern = "artifactize.dev", custom_domain = true }]

[assets]
directory = "./dist"
# The nearest 404.html: /docs/kr/missing serves dist/docs/kr/404.html, /docs/missing
# dist/docs/404.html (mdBook's), anything else dist/404.html.
not_found_handling = "404-page"
