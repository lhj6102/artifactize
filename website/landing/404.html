<script>
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('mdbook-theme'); } catch (e) {}
    if (theme && theme.charAt(0) === '"') theme = theme.slice(1, -1);
    // No choice yet: follow the system.
    var light = theme === 'light' || (theme !== 'navy' && !!window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  })();
</script>
