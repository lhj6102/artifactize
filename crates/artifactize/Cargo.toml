[package]
name = "artifactize"
description = "The AI-native collaboration layer for one-of-a-kind teammates and their agents: split a project into Artifacts with their own evals, and reuse every review while it still holds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://artifactize.dev/docs/"
readme = "../../README.md"
keywords = ["collaboration", "ai", "agent", "review", "llm"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]

# `cargo binstall artifactize` installs the archive that release.yml attaches to the
# GitHub release (.github/workflows/binaries.yml builds it) instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/artifactize-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "artifactize-v{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
artifactize-core.workspace = true
