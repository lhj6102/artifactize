[package]
name = "artifactize"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rusqlite = "0.8.0"
tokio-util = { version = "0.7", features = ["rt"] }
