[package]
name = "artifactize"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
jsonschema = { version = "0.58.4", default-features = false }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
libc = "0.2"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rusqlite = "0.8.0"
tokio-util = { version = "0.7", features = ["rt"] }
url = { version = "2", features = ["serde"] }
