[package]
name = "artifactize-desktop"
description = "Desktop app for artifactize monitor and Human reviews (experiment)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# The app embeds the built frontend (ui/dist); without this feature a debug build loads the
# Vite dev server instead.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
artifactize-core = { path = "../artifactize-core" }
artifactize-tools.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = { version = "2.12", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
# The CLI tests' shared helpers (tests/support: operating system, fake provider) need these.
base64 = "0.22"
sha2 = "0.11"
toml = "1.1.8"
tauri = { version = "2.12", features = ["test"] }
tempfile = "3.27"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
