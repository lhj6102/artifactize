[package]
name = "artifactize-desktop"
description = "Desktop app for artifactize monitor and Human reviews (experiment)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# The app embeds the built frontend (ui/dist); without this feature a debug build loads the
# Vite dev server instead.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
artifactize = { path = "../artifactize" }
artifactize-tools.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = { version = "2.12", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tempfile = "3.27"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
