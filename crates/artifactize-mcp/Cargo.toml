[package]
name = "artifactize-mcp"
description = "The MCP endpoint for artifactize's shared verification and inspection operations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://artifactize.dev/docs/agent-plugin/mcp.html"
keywords = ["collaboration", "review", "mcp"]
categories = ["development-tools", "development-tools::testing"]
exclude = ["index.artf"]

[dependencies]
artifactize-core.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
time = { version = "0.3", features = ["formatting", "parsing"] }