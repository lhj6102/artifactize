[package]
name = "artifactize-tools"
description = "Portable scoped tools and safe file access for artifactize."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "tools", "review"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["index.artf"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
jsonschema = { version = "0.58.4", default-features = false }
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt", "time", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27"
